<div class="auth-container">
  <div class="content-wrapper">
    <div class="right-content" [class.revealed]="isFormVisible">
      <div class="login-form">
        <div class="form-header">
          <h2>Mot de passe oublie ?</h2>
          <p>Saisissez votre email pour recevoir un lien de reinitialisation.</p>
        </div>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
          <div class="input-group">
            <label>EMAIL</label>
            <input type="email" formControlName="email" placeholder="exemple@parkini.com" />
            <div class="error-message" *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid">
              <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email requis</span>
              <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Email valide requis</span>
            </div>
          </div>

          <button type="submit" class="btn-login" [disabled]="forgotPasswordForm.invalid || isLoading">
            <span *ngIf="!isLoading">Envoyer le lien</span>
            <span *ngIf="isLoading">Envoi...</span>
          </button>
        </form>

        <div class="signup-link">
          <p>Retour a la connexion ? <a (click)="goToSignin()">Se connecter</a></p>
        </div>
      </div>
    </div>
  </div>
  <app-car-animation [run]="animateCar" [durationMs]="4200"></app-car-animation>
</div>
