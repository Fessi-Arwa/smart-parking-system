<div class="onboarding-shell">
  <div class="onboarding-card" [class.revealed]="isFormVisible">
    <div class="header">
      <span class="eyebrow">Conducteur</span>
      <h1>Ajoutez votre premier vehicule</h1>
      <p>Completez ces informations pour commencer a reserver une place plus rapidement.</p>
    </div>

    <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label>Matricule</label>
        <input type="text" formControlName="matricule" placeholder="123 TU 4567" />
      </div>

      <div class="input-group">
        <label>Marque</label>
        <input type="text" formControlName="marque" placeholder="Toyota" />
      </div>

      <div class="input-group">
        <label>Type de vehicule</label>
        <input type="text" formControlName="type" placeholder="SUV, berline, citadine..." />
      </div>

      <div class="actions">
        <button type="submit" class="primary-btn" [disabled]="vehicleForm.invalid || isLoading">
          {{ isLoading ? 'Enregistrement...' : 'Continuer' }}
        </button>
        <button type="button" class="secondary-btn" (click)="skip()">Passer pour le moment</button>
      </div>
    </form>
  </div>
  <app-car-animation [run]="animateCar" [durationMs]="4200"></app-car-animation>
</div>
