<div class="auth-container">
  <div class="content-wrapper">
    <div class="right-content" [class.revealed]="isFormVisible">
      <div class="login-form">
        <div class="form-header">
          <h2>Réinitialiser le mot de passe</h2>
          <p>Choisissez un nouveau mot de passe sécurisé.</p>
        </div>

        <ng-container *ngIf="token; else invalidTokenBlock">
          <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
            <div class="input-group">
              <label>NOUVEAU MOT DE PASSE</label>
              <input type="password" formControlName="password" placeholder="........" />
              <div class="error-message" *ngIf="resetPasswordForm.get('password')?.touched && resetPasswordForm.get('password')?.invalid">
                <span *ngIf="resetPasswordForm.get('password')?.errors?.['required']">Mot de passe requis</span>
                <span *ngIf="resetPasswordForm.get('password')?.errors?.['minlength']">Minimum 6 caractères</span>
              </div>
            </div>

            <div class="input-group">
              <label>CONFIRMER LE MOT DE PASSE</label>
              <input type="password" formControlName="confirmPassword" placeholder="........" />
              <div class="error-message" *ngIf="resetPasswordForm.get('confirmPassword')?.touched && resetPasswordForm.errors?.['mismatch']">
                Les mots de passe ne correspondent pas
              </div>
            </div>

            <button type="submit" class="btn-login" [disabled]="resetPasswordForm.invalid || isLoading">
              <span *ngIf="!isLoading">Mettre à jour</span>
              <span *ngIf="isLoading">Mise à jour...</span>
            </button>
          </form>

          <div class="signup-link">
            <p>Retour à la connexion ? <a (click)="goToSignin()">Se connecter</a></p>
          </div>
        </ng-container>

        <ng-template #invalidTokenBlock>
          <div class="invalid-token-card">
            <p>Ce lien de réinitialisation est invalide ou incomplet.</p>
            <button type="button" class="btn-login" (click)="goToForgotPassword()">Demander un nouveau lien</button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
  <app-car-animation [run]="animateCar" [durationMs]="4200"></app-car-animation>
</div>
