<div class="auth-container">
  <!-- Contenu qui sera révélé -->
  <div class="content-wrapper">
    <div class="left-content">
      <div class="app-name">
        <h1>
          PARKINI
          <span>SMART PARKING</span>
        </h1>
        <div class="app-tagline">● STATIONNEMENT INTELLIGENT ●</div>
      </div>
    </div>
    
    <div class="right-content">
      <div class="login-form">
        <div class="form-header">
          <h2>Bienvenue</h2>
          <p>Connectez-vous à votre espace</p>
        </div>
        
        <form [formGroup]="signinForm" (ngSubmit)="onSubmit()">
          <div class="input-group">
            <label>EMAIL</label>
            <input 
              type="email" 
              formControlName="email"
              placeholder="exemple@parkini.com">
          </div>
          
          <div class="input-group">
            <label>MOT DE PASSE</label>
            <input 
              type="password" 
              formControlName="password"
              placeholder="••••••••">
          </div>
          
          <button 
            type="submit" 
            class="btn-login"
            [disabled]="signinForm.invalid || isLoading">
            <span *ngIf="!isLoading">Se connecter</span>
            <span *ngIf="isLoading">Connexion...</span>
          </button>
        </form>
        
        <div class="signup-link">
          <p>Pas encore de compte ? <a (click)="goToSignup()">Créer un compte</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Voile blanc -->
  <div class="reveal-layer" id="revealLayer"></div>
  
  <!-- Voiture -->
  <div class="car-zipper" id="carZipper">
    <svg class="car-svg" width="180" height="90" viewBox="0 0 180 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="35" width="130" height="35" rx="8" fill="#2c3e50"/>
      <rect x="45" y="15" width="80" height="25" rx="6" fill="#34495e"/>
      <polygon points="45,40 60,20 80,20 80,40" fill="#7f8c8d"/>
      <polygon points="90,40 90,20 110,20 125,40" fill="#7f8c8d"/>
      <rect x="60" y="22" width="20" height="15" fill="#bdc3c7"/>
      <rect x="90" y="22" width="20" height="15" fill="#bdc3c7"/>
      <circle cx="45" cy="70" r="12" fill="#1a1a2e"/>
      <circle cx="45" cy="70" r="6" fill="#4a5568"/>
      <circle cx="125" cy="70" r="12" fill="#1a1a2e"/>
      <circle cx="125" cy="70" r="6" fill="#4a5568"/>
      <circle cx="25" cy="52" r="5" fill="#f39c12"/>
      <circle cx="148" cy="52" r="5" fill="#e74c3c"/>
      <rect x="95" y="48" width="15" height="3" rx="1" fill="#95a5a6"/>
    </svg>
  </div>
</div>
