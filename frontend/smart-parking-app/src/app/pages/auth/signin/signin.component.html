<div class="auth-container">
  <div class="content-wrapper">
    <div class="right-content" [class.revealed]="isFormVisible">
      <div class="login-form">
        <div class="form-header">
          <h2>Bienvenue</h2>
          <p>Connectez-vous a votre espace</p>
        </div>

        <form [formGroup]="signinForm" (ngSubmit)="onSubmit()">
          <div class="input-group">
            <label>Email</label>
            <input type="email" formControlName="email" placeholder="exemple@parkini.com" />
          </div>

          <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" formControlName="password" placeholder="........" />
          </div>

          <div class="forgot-link">
            <a (click)="goToForgotPassword()">Mot de passe oublie ?</a>
          </div>

          <button type="submit" class="btn-login" [disabled]="signinForm.invalid || isLoading">
            <span *ngIf="!isLoading">Se connecter</span>
            <span *ngIf="isLoading">Connexion...</span>
          </button>
        </form>

        <div class="signup-link">
          <p>Pas encore de compte ? <a (click)="goToSignup()">Creer un compte</a></p>
        </div>
      </div>
    </div>
  </div>

  <app-car-animation [run]="animateCar" [durationMs]="4200"></app-car-animation>
</div>
